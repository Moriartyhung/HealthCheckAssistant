org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ===== Backend Base URL（集中設定，唯一來源）=====
# 請改成 Spring Boot Backend 所在電腦的 LAN IP，例如 http://192.168.1.23:8080/
# 不要使用 localhost；10.0.2.2 只在 Backend 與 Emulator 在同一台 Windows 時才可用。
# App 內「伺服器設定」也可在執行期覆寫（存在 SharedPreferences），不必重新 Build。
healthcheck.baseUrl=http://192.168.0.100:8080/

# Fallback if built from the original (non-ASCII) folder path
android.overridePathCheck=true
